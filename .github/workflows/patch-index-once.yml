name: Patch index once

on:
  push:
    paths:
      - '.github/workflows/patch-index-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          html = html.replace('<title>Mi Álbum Mundial 2026</title>', '<title>ALBUM 2026</title>')
          html = html.replace('<meta name="apple-mobile-web-app-title" content="Álbum 2026" />', '<meta name="apple-mobile-web-app-title" content="ALBUM 2026" />')
          html = re.sub(r'<h1>Mi Álbum Mundial 2026</h1>\s*<p class="subtitle">.*?</p>', '<h1>ALBUM 2026</h1>', html, flags=re.S)
          html = html.replace('@media (min-width: 760px) { .toolbar { grid-template-columns: 1.1fr auto auto auto auto; align-items: center; } }', '@media (min-width: 760px) { .toolbar { grid-template-columns: 1.1fr auto auto; align-items: center; } }')

          css_insert = '''
    .view-actions { display:flex; align-items:center; gap:8px; width:100%; }
    .view-actions select { flex:1; min-width:0; }
    .icon-btn {
      width: 42px; height: 42px; min-width: 42px; min-height: 42px; padding: 0;
      border-radius: 999px; font-size: 18px; line-height: 1; font-weight: 900;
    }
    @media (min-width: 760px) { .view-actions { width:auto; } .view-actions select { min-width: 170px; } }
'''
          if '.view-actions {' not in html:
              html = html.replace('    .btn.danger { color: #fecaca; border-color: rgba(248,113,113,.35); }\n', '    .btn.danger { color: #fecaca; border-color: rgba(248,113,113,.35); }\n' + css_insert)

          old_controls = '''          <select id="view">
            <option value="all">Ver todo</option>
            <option value="missing">Solo faltantes</option>
            <option value="owned">Solo tengo</option>
            <option value="duplicates">Solo repetidas</option>
          </select>
          <button class="btn" id="openAll">Abrir secciones</button>
          <button class="btn" id="closeAll">Cerrar secciones</button>'''
          new_controls = '''          <div class="view-actions">
            <select id="view" aria-label="Filtrar categorías">
              <option value="all">Ver todo</option>
              <option value="missing">Solo faltantes</option>
              <option value="owned">Solo tengo</option>
              <option value="duplicates">Solo repetidas</option>
            </select>
            <button class="btn icon-btn" id="openAll" title="Abrir secciones" aria-label="Abrir secciones">▾</button>
            <button class="btn icon-btn" id="closeAll" title="Cerrar secciones" aria-label="Cerrar secciones">▴</button>
          </div>'''
          if old_controls in html:
              html = html.replace(old_controls, new_controls)
          else:
              html = re.sub(r'\s*<select id="view">\s*<option value="all">Ver todo</option>\s*<option value="missing">Solo faltantes</option>\s*<option value="owned">Solo tengo</option>\s*<option value="duplicates">Solo repetidas</option>\s*</select>\s*<button class="btn" id="openAll">Abrir secciones</button>\s*<button class="btn" id="closeAll">Cerrar secciones</button>', '\n' + new_controls, html, flags=re.S)

          addon = r'''

    // Mejoras visuales y táctiles añadidas para móvil/PWA.
    const SECTION_FLAGS = {
      "00":"✨", "FWC":"🏆", "MEX":"🇲🇽", "CAN":"🇨🇦", "USA":"🇺🇸", "RSA":"🇿🇦", "KOR":"🇰🇷", "CZE":"🇨🇿", "QAT":"🇶🇦", "ECU":"🇪🇨", "SEN":"🇸🇳", "NED":"🇳🇱", "ENG":"🏴", "IRN":"🇮🇷", "WAL":"🏴", "ARG":"🇦🇷", "KSA":"🇸🇦", "POL":"🇵🇱", "FRA":"🇫🇷", "AUS":"🇦🇺", "DEN":"🇩🇰", "TUN":"🇹🇳", "ESP":"🇪🇸", "CRC":"🇨🇷", "GER":"🇩🇪", "JPN":"🇯🇵", "BEL":"🇧🇪", "MAR":"🇲🇦", "CRO":"🇭🇷", "BRA":"🇧🇷", "SRB":"🇷🇸", "SUI":"🇨🇭", "CMR":"🇨🇲", "POR":"🇵🇹", "GHA":"🇬🇭", "URU":"🇺🇾", "COL":"🇨🇴", "PER":"🇵🇪", "CHI":"🇨🇱", "PAR":"🇵🇾", "BOL":"🇧🇴", "VEN":"🇻🇪", "NZL":"🇳🇿", "JAM":"🇯🇲", "PAN":"🇵🇦", "HAI":"🇭🇹", "CUR":"🇨🇼", "ALG":"🇩🇿", "EGY":"🇪🇬", "NGA":"🇳🇬", "CIV":"🇨🇮", "GAB":"🇬🇦", "CPV":"🇨🇻", "TUR":"🇹🇷", "ITA":"🇮🇹", "NOR":"🇳🇴", "SWE":"🇸🇪", "UKR":"🇺🇦", "AUT":"🇦🇹", "HUN":"🇭🇺", "ROU":"🇷🇴", "GRE":"🇬🇷", "SCO":"🏴", "IRL":"🇮🇪", "NIR":"🇬🇧"
    };

    function decorateSectionFlags() {
      document.querySelectorAll(".sec-title").forEach((sectionTitle) => {
        const codeEl = sectionTitle.querySelector(".sec-code");
        const nameEl = sectionTitle.querySelector(".sec-name");
        if (!codeEl || !nameEl) return;
        const code = codeEl.textContent.trim().toUpperCase();
        const flag = SECTION_FLAGS[code];
        if (!flag || nameEl.dataset.flagApplied === "true") return;
        nameEl.textContent = `${flag} ${nameEl.textContent.replace(/^\S+\s/, "")}`;
        nameEl.dataset.flagApplied = "true";
      });
    }

    function vibrateTiny() {
      if ("vibrate" in navigator) navigator.vibrate(12);
    }

    document.addEventListener("click", (event) => {
      if (event.target.closest(".plus") || event.target.closest("#registerBtn")) vibrateTiny();
    }, { passive: true });

    const sectionContainerForFlags = document.getElementById("sections");
    if (sectionContainerForFlags) {
      new MutationObserver(decorateSectionFlags).observe(sectionContainerForFlags, { childList: true, subtree: true });
      decorateSectionFlags();
    }
'''
          if 'const SECTION_FLAGS' not in html:
              pos = html.rfind('</script>')
              if pos == -1:
                  raise SystemExit('No se encontró </script>')
              html = html[:pos] + addon + html[pos:]

          if html == original:
              print('index.html ya estaba actualizado')
          else:
              path.write_text(html, encoding='utf-8')
          PY

      - name: Commit patched index and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-index-once.yml
          git add index.html
          git commit -m "Update album UI and mobile feedback" || echo "No changes to commit"
          git push
